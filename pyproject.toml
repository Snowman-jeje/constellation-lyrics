[project]
name = "constellation-lyrics"
version = "2.0.0"
description = "Cross-platform music-reactive constellation synced lyrics visualizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "soundcard>=0.4.6",
    "winrt-runtime>=3.0.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.0.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0.0; sys_platform == 'win32'",
]
