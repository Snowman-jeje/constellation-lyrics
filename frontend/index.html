<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Constellation Lyrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261119f">
</head>
<body>
  <!-- Cinematic Album Art Background -->
  <div id="album-backdrop-container">
    <div id="album-backdrop-prev" class="album-backdrop"></div>
    <div id="album-backdrop-curr" class="album-backdrop"></div>
    <div id="album-backdrop-overlay"></div>
  </div>

  <!-- Ambient Backlight Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Constellation Interactive Canvas -->
  <canvas id="constellation-canvas"></canvas>

  <!-- Left Sidebar: Rotated Vertical Album / Track Title -->
  <aside id="album-sidebar">
    <span id="album-title-text">YOUTUBE MUSIC</span>
  </aside>

  <!-- Status / Fallback Indicator -->
  <div id="status-badge" class="hidden">
    <span id="status-text">Ambient Starfield</span>
  </div>

  <!-- Bottom Floating Media Bar (Auto-hiding) -->
  <footer id="player-bar" class="visible">
    <div class="player-content">
      <div class="track-artwork">
        <img id="track-art-img" src="" alt="" class="hidden">
        <div id="track-art-placeholder" class="art-placeholder">♫</div>
      </div>
      <div class="track-details">
        <div id="track-title" class="track-title">Waiting for music...</div>
        <div id="track-artist" class="track-artist">Play music in YouTube Music or Spotify</div>
      </div>
      <div class="player-controls">
        <button id="btn-prev" class="ctrl-btn" title="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="ctrl-btn play-btn" title="Play/Pause">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-next" class="ctrl-btn" title="Next Track">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="player-extra">
        <button id="btn-sync-down" class="ctrl-btn mini-btn" title="Sync Earlier (-0.2s)">-0.2s</button>
        <span id="sync-offset-label" class="sync-label" title="Manual Sync Offset">0.0s</span>
        <button id="btn-sync-up" class="ctrl-btn mini-btn" title="Sync Later (+0.2s)">+0.2s</button>
        <button id="btn-fullscreen" class="ctrl-btn mini-btn" title="Toggle Fullscreen (F11)">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
    <div class="progress-container" id="progress-bar-container">
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-time">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
  </footer>

  <!-- Scripts with cache busting query string -->
  <script src="js/constellation.js?v=20261119f"></script>
  <script src="js/renderer.js?v=20261119f"></script>
  <script src="js/app.js?v=20261119f"></script>
</body>
</html>
